[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cybersecurity-threat-intelligence-reference"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pydantic==2.14.3", "scikit-learn==1.9.1"]

[project.optional-dependencies]
dev = ["pytest==8.4.2"]

[project.scripts]
threat-intel = "threat_intelligence_reference.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["src"]
